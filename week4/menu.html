<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>

    <div class="big-box">

        <div class="bg-image box">

            <img src="images/logo-light.webp" alt="logo" width="120" height="auto">

        </div>

        <div class="bg-text box">

            Home <span class="red">Services</span> Work <span class="project">Project Details</span> Contact

        </div>

        <div class="bg-contact box">
            <div class="phone-img">
                <img src="images/phone-call.png" alt="phone" width="30" height="auto">
            </div>
            <div class="number">555-123-4567</div>

            <div class="button">
                <button>Contact</button>
            </div>
            <div class="special">
                <img src="images/menu-burger.png" alt="search" width="20">
            </div>

        </div>



    </div>


</body>

</html>
